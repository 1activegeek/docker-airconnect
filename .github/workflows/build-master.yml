name: Multi-Arch Build - Master

on:
  schedule:
    - cron: '0 2 * * 6'
  workflow_dispatch:
    inputs:
      VERSION:
        description: "Optional version tag to override AirConnect release version"
        required: false
        default: ""

jobs:
  build-master:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup qemu
        uses: docker/setup-qemu-action@v3

      - name: Setup buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare build and tags
        id: prepare
        run: |
          DOCKER_IMAGE=1activegeek/airconnect
          DOCKER_PLATFORMS=linux/amd64,linux/arm64
          # linux/arm/v7 removed as deprecated by ls.io
          AIRCONNECT_REPO=tunlezah/AirConnect
          # Pin the build to the current head of the AirConnect source and read its version
          AIRCONNECT_REF=$(git ls-remote https://github.com/${AIRCONNECT_REPO}.git refs/heads/master | cut -f 1)
          VERSION="${{ github.event.inputs.VERSION }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -fsSL https://raw.githubusercontent.com/${AIRCONNECT_REPO}/${AIRCONNECT_REF}/airupnp/src/airupnp.h | sed -n 's/^#define VERSION "v\([0-9.]*\).*/\1/p')
          fi
          if [ -z "$AIRCONNECT_REF" ] || [ -z "$VERSION" ]; then echo "Unable to determine AirConnect source version" && exit 1; fi

          TAGS="--tag ${DOCKER_IMAGE}:${VERSION} --tag ${DOCKER_IMAGE}:latest"
          
          echo "docker_image=${DOCKER_IMAGE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "buildx_args=--platform ${DOCKER_PLATFORMS} \
            --build-arg VERSION=${VERSION} \
            --build-arg AIRCONNECT_REF=${AIRCONNECT_REF} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg VCS_REF=${GITHUB_SHA::8} \
            ${TAGS} --file ./Dockerfile ./" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and Push
        if: github.event_name != 'pull_request'
        run: |
          docker buildx build --output "type=image,push=true" ${{ steps.prepare.outputs.buildx_args }}

      - name: Inspect Image
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools inspect ${{ steps.prepare.outputs.docker_image }}:${{ steps.prepare.outputs.version }}